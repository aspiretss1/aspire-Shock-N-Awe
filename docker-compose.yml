services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
    ports:
      # Localhost only — host Caddy on 80/443 terminates TLS and proxies here.
      - "127.0.0.1:5000:5000"
    env_file: .env
    environment:
      PORT: 5000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
